[project]
name = "argusvue"
version = "0.1.0"
description = "Living synthesis layer for regional real estate and economic intelligence (pilot: metro Phoenix AZ, Jackson WY)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "typer>=0.12",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "pdfplumber>=0.11",
    "h3>=4.1",
    "shapely>=2.0",
    "psycopg[binary,pool]>=3.2",
    "pyyaml>=6.0",
    "pyogrio>=0.10",
    "openpyxl>=3.1",
    "apscheduler>=3.10,<4",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "anthropic>=2.5.0",
    "feedparser>=6.0.14",
]

[project.scripts]
argusvue = "argusvue.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["argusvue"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: needs a reachable Postgres/PostGIS (TEST_DATABASE_URL)",
    "gazetteer: needs the real gazetteer loaded for both regions",
]

[tool.ruff]
line-length = 110
target-version = "py312"
