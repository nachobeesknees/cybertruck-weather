  jh-jackson-news:     {region: jh, kind: feed, target: "https://www.jacksonwy.gov/RSSFeed.aspx?ModID=1&CID=All-newsflash.xml", cadence: weekly, tags: [policy], reliability: 0.95, ai_bot_rule: true, max_items: 5}
  jh-jackson-civicclerk: {region: jh, kind: url, target: "https://jacksonwy.api.civicclerk.com/v1/Events?$top=25&$orderby=startDateTime%20desc", cadence: daily, tags: [agendas, policy, housing_policy], reliability: 0.95}
  # ================================================================= Jackson: tourism, transport, state ==
  jh-jhttb:            {region: jh, kind: feed, target: "https://industry.visitjacksonhole.com/feed/", cadence: weekly, tags: [tourism, taxes], reliability: 0.85}
  jh-airport:          {region: jh, kind: feed, target: "https://www.jacksonholeairport.com/feed/", cadence: weekly, tags: [tourism, transport], reliability: 0.9}
  jh-nps-grte:         {region: jh, kind: feed, target: "https://www.nps.gov/feeds/getNewsRSS.htm?id=grte", cadence: weekly, tags: [tourism, transport], reliability: 0.95}
  jh-wyo-tourism:      {region: jh, kind: feed, target: "https://travelwyoming.com/news/rss", cadence: weekly, tags: [tourism], reliability: 0.85}
  jh-wyo-bizcouncil:   {region: jh, kind: feed, target: "https://wyomingbusiness.org/feed/", cadence: weekly, tags: [employers, policy], reliability: 0.85, keywords: [Teton, Jackson, housing, Star Valley, Alpine, Lincoln County]}
  jh-allure:           {region: jh, kind: feed, target: "https://wyoming.allurebrokerage.com/feed/", cadence: weekly, tags: [housing_market, brokerage_report], reliability: 0.55, notes: "Cite only."}
  jh-wydot-news:       {region: jh, kind: page, target: "https://www.dot.state.wy.us/home/news_info/news_releases.html", cadence: daily, tags: [transport], reliability: 0.9, allow_patterns: ["news_releases/"], deny_patterns: ["-releases\\.html$"], max_items: 6}
  jh-wyoroad:          {region: jh, kind: url, target: "https://wyoroad.info/pls/Browse/WRR.ConditionsQuery", cadence: hourly, tags: [transport], reliability: 0.9, notes: "Builds our own Teton Pass closure history (no public log exists)."}
  # ================================================================= Jackson: search objectives ==
  jh-search-housing:   {region: jh, kind: search, target: "Teton County and Town of Jackson workforce housing: deed-restricted units, lottery results, waitlist, new affordable projects, housing department decisions", cadence: weekly, tags: [housing_policy], reliability: 0.6, max_items: 6}
  jh-search-str:       {region: jh, kind: search, target: "Jackson Hole short-term rental regulation, lodging tax collections, Teton County lodging tax revenue reports", cadence: weekly, tags: [policy, taxes, tourism], reliability: 0.6, max_items: 5}
