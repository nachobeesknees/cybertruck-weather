  jh-search-market:    {region: jh, kind: search, target: "Jackson Hole real estate market report quarterly median sale price, inventory, sales volume Teton County", cadence: weekly, tags: [housing_market, brokerage_report], reliability: 0.55, max_items: 4, notes: "Cite only; no MLS data."}
