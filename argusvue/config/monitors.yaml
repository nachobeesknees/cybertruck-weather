# Web monitors we poll ourselves (no third-party monitoring service). Each becomes a `sources` row.
# kind: feed (RSS/Atom) | page (index page with links) | json (JSON list with document links) | url (one page) |
#       search (Claude web search objective). cadence: hourly | daily | weekly. reliability feeds claim confidence.
# keywords: for broad feeds, fetch only items whose title/summary mentions one (case-insensitive).
# ai_bot_rule: the host's robots.txt names AI crawlers (ClaudeBot etc.); our User-Agent is not one, but STRICT_ROBOTS
# disables these. Verified 2026-11-05; see docs/DECISIONS.md for blocked hosts (azcentral, bizjournals, axios, ktar, ...).
monitors:
  # ================================================================= Phoenix: local news ==
  phx-azmirror:        {region: phx, kind: feed, target: "https://azmirror.com/feed/", cadence: daily, tags: [policy, legislature, housing_policy], reliability: 0.75, ai_bot_rule: true, keywords: [housing, rent, water, groundwater, property tax, zoning, data center, APS, SRP, Phoenix, Maricopa, Pinal, TSMC, semiconductor, migration, apartment, homeless, eviction]}
  phx-azbig-re:        {region: phx, kind: feed, target: "https://azbigmedia.com/category/real-estate/feed/", cadence: daily, tags: [housing_market, employers], reliability: 0.6, max_items: 15}
  phx-azbig-biz:       {region: phx, kind: feed, target: "https://azbigmedia.com/category/business/feed/", cadence: daily, tags: [employers], reliability: 0.55, keywords: [jobs, expansion, headquarters, data center, TSMC, Intel, Amkor, semiconductor, manufacturing, plant, facility, campus, acres, square feet, apartment, industrial]}
  phx-chamberbiz:      {region: phx, kind: feed, target: "https://www.chamberbusinessnews.com/feed/", cadence: daily, tags: [employers, policy], reliability: 0.6}
  phx-azfamily:        {region: phx, kind: feed, target: "https://www.azfamily.com/arc/outboundfeeds/rss/?outputType=xml", cadence: daily, tags: [housing_market, policy], reliability: 0.65, ai_bot_rule: true, keywords: [housing, rent, home prices, water, groundwater, data center, APS, SRP, zoning, council, apartment, TSMC, eviction, homeless]}
  phx-12news:          {region: phx, kind: feed, target: "https://www.12news.com/feeds/syndication/rss/news/local", cadence: daily, tags: [housing_market, policy], reliability: 0.65, keywords: [housing, rent, home prices, water, groundwater, data center, APS, SRP, zoning, council, apartment, TSMC, development]}
  phx-abc15-biz:       {region: phx, kind: feed, target: "https://www.abc15.com/news/business.rss", cadence: daily, tags: [employers, housing_market], reliability: 0.65}
  phx-kjzz-biz:        {region: phx, kind: feed, target: "https://www.kjzz.org/business.rss", cadence: daily, tags: [power, water, housing_market], reliability: 0.75}
  phx-kjzz-politics:   {region: phx, kind: feed, target: "https://www.kjzz.org/politics.rss", cadence: daily, tags: [policy], reliability: 0.75, keywords: [housing, water, tax, zoning, legislature, data center, energy]}
  phx-cronkite:        {region: phx, kind: feed, target: "https://cronkitenews.azpbs.org/feed/", cadence: daily, tags: [policy, housing_policy], reliability: 0.7, keywords: [housing, water, groundwater, power, legislature, rent, zoning, data center, Phoenix, Maricopa, Pinal]}
  phx-azcapitol:       {region: phx, kind: feed, target: "https://azcapitoltimes.com/feed/", cadence: daily, tags: [legislature, policy], reliability: 0.7, paywall: true, keywords: [housing, water, groundwater, property tax, zoning, data center, legislature, bill, rent]}
  phx-newtimes:        {region: phx, kind: feed, target: "https://www.phoenixnewtimes.com/phoenix/Rss.xml", cadence: daily, tags: [policy], reliability: 0.55, ai_bot_rule: true, keywords: [housing, rent, apartment, zoning, council, water, data center, development, eviction]}
  phx-bisnow:          {region: phx, kind: feed, target: "https://www.bisnow.com/rss/phoenix", cadence: daily, tags: [housing_market, data_centers, employers], reliability: 0.7}
  phx-bisnow-all:      {region: phx, kind: feed, target: "https://www.bisnow.com/rss", cadence: daily, tags: [data_centers, housing_market], reliability: 0.65, keywords: [Phoenix, Arizona, Mesa, Chandler, Goodyear, Buckeye, Scottsdale, Tempe, Gilbert, Maricopa, Pinal]}
  phx-redfin-news:     {region: phx, kind: feed, target: "https://www.redfin.com/news/feed/", cadence: daily, tags: [housing_market, benchmark], reliability: 0.65, keywords: [Phoenix, Arizona, mortgage rate, price drop, inventory, Sun Belt]}
  phx-realtor-research: {region: phx, kind: feed, target: "https://www.realtor.com/research/feed/", cadence: weekly, tags: [housing_market, benchmark], reliability: 0.65, keywords: [Phoenix, Arizona, monthly housing trends, inventory, price]}
  phx-housingwire:     {region: phx, kind: feed, target: "https://www.housingwire.com/feed/", cadence: daily, tags: [housing_market, housing_policy], reliability: 0.6, keywords: [Phoenix, Arizona, Sun Belt]}
  phx-nahb-eoh:        {region: phx, kind: feed, target: "https://eyeonhousing.org/feed/", cadence: daily, tags: [housing_market, benchmark], reliability: 0.7, keywords: [permits, starts, Phoenix, Arizona, West, multifamily, single-family]}
  phx-semi-digest:     {region: phx, kind: feed, target: "https://www.semiconductor-digest.com/feed/", cadence: daily, tags: [employers], reliability: 0.6, keywords: [TSMC, Amkor, Intel, Arizona, Phoenix, Chandler, Peoria]}
  # ================================================================= Phoenix: employers, data centers, power, water ==
  phx-srp:             {region: phx, kind: feed, target: "https://media.srpnet.com/feed/", cadence: daily, tags: [power, water], reliability: 0.9}
  phx-gpec:            {region: phx, kind: feed, target: "https://www.gpec.org/feed/", cadence: weekly, tags: [employers, data_centers], reliability: 0.8}
  phx-intel-ir:        {region: phx, kind: feed, target: "https://www.intc.com/news-events/press-releases/rss", cadence: weekly, tags: [employers], reliability: 0.9, keywords: [Arizona, Ocotillo, Chandler, fab, Fab 52, Fab 62, 18A, foundry, capacity, layoffs, workforce]}
  phx-msft-source:     {region: phx, kind: feed, target: "https://news.microsoft.com/source/feed/", cadence: daily, tags: [data_centers, employers], reliability: 0.9, keywords: [Arizona, Phoenix, Goodyear, El Mirage, datacenter, data center]}
  phx-google-infra:    {region: phx, kind: feed, target: "https://blog.google/inside-google/infrastructure/rss/", cadence: weekly, tags: [data_centers, power], reliability: 0.9, keywords: [Arizona, Mesa, Phoenix, data center]}
  phx-meta-news:       {region: phx, kind: feed, target: "https://about.fb.com/news/feed/", cadence: daily, tags: [data_centers], reliability: 0.9, keywords: [Arizona, Mesa, data center]}
  phx-dcd:             {region: phx, kind: feed, target: "https://www.datacenterdynamics.com/en/rss/", cadence: daily, tags: [data_centers, power], reliability: 0.65, keywords: [Phoenix, Arizona, Mesa, Goodyear, Chandler, Buckeye, Tempe, Glendale, APS, SRP]}
  phx-dck:             {region: phx, kind: feed, target: "https://www.datacenterknowledge.com/rss.xml", cadence: daily, tags: [data_centers, power], reliability: 0.65, ai_bot_rule: true, keywords: [Phoenix, Arizona, Mesa, Goodyear, Chandler, APS, SRP]}
  phx-eia:             {region: phx, kind: feed, target: "https://www.eia.gov/rss/todayinenergy.xml", cadence: daily, tags: [power, benchmark], reliability: 0.9, keywords: [Arizona, data center, Southwest, Phoenix, electricity demand]}
  # ================================================================= Phoenix: government, agendas, policy ==
  phx-azre:            {region: phx, kind: feed, target: "https://azre.gov/rss.xml", cadence: weekly, tags: [policy, housing_policy], reliability: 0.9}
  phx-maricopa-news:   {region: phx, kind: feed, target: "https://www.maricopa.gov/RSSFeed.aspx?ModID=1&CID=All-newsflash.xml", cadence: daily, tags: [policy, agendas, taxes], reliability: 0.9, ai_bot_rule: true, max_items: 10}
  phx-maricopa-agenda: {region: phx, kind: feed, target: "https://www.maricopa.gov/RSSFeed.aspx?ModID=65&CID=All-0", cadence: weekly, tags: [agendas], reliability: 0.9, ai_bot_rule: true, max_items: 10}
  phx-pinal-news:      {region: phx, kind: feed, target: "https://www.pinal.gov/RSSFeed.aspx?ModID=1&CID=All-newsflash.xml", cadence: daily, tags: [agendas, policy], reliability: 0.9, max_items: 10}
  phx-casagrande-news: {region: phx, kind: feed, target: "https://www.casagrandeaz.gov/RSSFeed.aspx?ModID=1&CID=All-newsflash.xml", cadence: weekly, tags: [policy], reliability: 0.85, ai_bot_rule: true, max_items: 10}
  phx-phoenix-legistar: {region: phx, kind: json, target: "https://webapi.legistar.com/v1/phoenix/events?$top=40&$orderby=EventDate%20desc", cadence: daily, tags: [agendas, policy, housing_policy], reliability: 0.95, json_items: "", json_link_keys: [EventAgendaFile, EventMinutesFile], json_date_key: EventDate, json_title_keys: [EventBodyName, EventDate], max_age_days: 45, max_items: 10}
  phx-mesa-legistar:   {region: phx, kind: json, target: "https://webapi.legistar.com/v1/mesa/events?$top=40&$orderby=EventDate%20desc&$filter=EventDate%20le%20datetime%272099-01-01%27", cadence: daily, tags: [agendas, policy], reliability: 0.95, json_items: "", json_link_keys: [EventAgendaFile, EventMinutesFile], json_date_key: EventDate, json_title_keys: [EventBodyName, EventDate], max_age_days: 45, max_items: 10}
  phx-apachejct-legistar: {region: phx, kind: json, target: "https://webapi.legistar.com/v1/apachejunction/events?$top=20&$orderby=EventDate%20desc", cadence: weekly, tags: [agendas], reliability: 0.9, json_items: "", json_link_keys: [EventAgendaFile, EventMinutesFile], json_date_key: EventDate, json_title_keys: [EventBodyName, EventDate], max_age_days: 45, max_items: 6}
  phx-scottsdale-civicclerk: {region: phx, kind: url, target: "https://scottsdaleaz.api.civicclerk.com/v1/Events?$top=25&$orderby=startDateTime%20desc", cadence: daily, tags: [agendas, policy], reliability: 0.9}
  phx-surprise-civicclerk:   {region: phx, kind: url, target: "https://surpriseaz.api.civicclerk.com/v1/Events?$top=25&$orderby=startDateTime%20desc", cadence: daily, tags: [agendas, policy], reliability: 0.9, ai_bot_rule: true}
  # ================================================================= Phoenix: market reports (cite only), benchmarks ==
  phx-armls:           {region: phx, kind: feed, target: "https://armls.com/feed/", cadence: weekly, tags: [housing_market, brokerage_report], reliability: 0.7, notes: "Public STAT report posts only; cite, never republish tables."}
  phx-armls-stats:     {region: phx, kind: page, target: "https://armls.com/statistics", cadence: weekly, tags: [housing_market, brokerage_report], reliability: 0.7, allow_patterns: ["\\.pdf$", "/statistics/"], max_items: 3, notes: "Public PDFs only."}
  phx-cromford:        {region: phx, kind: feed, target: "https://cromfordreport.com/feed", cadence: weekly, tags: [housing_market, benchmark], reliability: 0.7, notes: "Public posts only; never subscriber content (SPEC §5)."}
  phx-phxrealtors:     {region: phx, kind: url, target: "https://www.phoenixrealtors.com/main/market-stats/", cadence: weekly, tags: [housing_market, brokerage_report], reliability: 0.65}
  phx-zumper:          {region: phx, kind: url, target: "https://www.zumper.com/rent-research/phoenix-az", cadence: weekly, tags: [housing_market, benchmark], reliability: 0.55}
  phx-census-ind:      {region: phx, kind: feed, target: "https://www.census.gov/economic-indicators/indicator.xml", cadence: weekly, tags: [benchmark], reliability: 0.95, keywords: [housing, construction, permits, starts, residential]}
  phx-fed:             {region: phx, kind: feed, target: "https://www.federalreserve.gov/feeds/press_all.xml", cadence: weekly, tags: [benchmark], reliability: 0.95, keywords: [FOMC statement, federal funds, rate]}
  # ================================================================= Phoenix: search objectives (Claude web search, our fetcher) ==
  phx-search-tsmc:        {region: phx, kind: search, target: "TSMC Arizona fab construction progress, supplier announcements, hiring, delays, investment figures in north Phoenix", cadence: daily, tags: [employers], reliability: 0.6, max_items: 6, geo_scope: "sub:phx-north-tsmc"}
  phx-search-datacenters: {region: phx, kind: search, target: "New data center proposals, approvals, zoning fights, power requests and opposition in metro Phoenix (Mesa, Goodyear, Buckeye, Chandler, Glendale, Pinal County)", cadence: daily, tags: [data_centers, power, policy], reliability: 0.6, max_items: 6}
  phx-search-water:       {region: phx, kind: search, target: "ADWR assured water supply determinations, groundwater model updates, Phoenix AMA and Pinal AMA decisions affecting new subdivisions and lots", cadence: weekly, tags: [water, policy], reliability: 0.6, max_items: 6}
  phx-search-apartments:  {region: phx, kind: search, target: "Phoenix metro apartment rents, concessions, occupancy, new deliveries and oversupply reports", cadence: weekly, tags: [housing_market], reliability: 0.6, max_items: 6}
  phx-search-foreclosures: {region: phx, kind: search, target: "Maricopa County notices of trustee sale and foreclosure filings monthly counts, public reporting", cadence: weekly, tags: [housing_market], reliability: 0.5, max_items: 4, notes: "Fallback for the missing Recorder feed; low confidence."}
  phx-search-power:       {region: phx, kind: search, target: "APS and SRP large-load interconnection requests, transmission projects, Arizona Corporation Commission decisions on data center power", cadence: weekly, tags: [power, policy], reliability: 0.6, max_items: 6}
  phx-search-council:     {region: phx, kind: search, target: "Phoenix, Mesa, Chandler, Gilbert, Scottsdale, Tempe, Glendale, Peoria, Surprise, Goodyear, Buckeye, Queen Creek, Casa Grande council and planning commission rezoning approvals for housing and industrial projects this week", cadence: weekly, tags: [agendas, policy], reliability: 0.6, max_items: 8}
  phx-search-migration:   {region: phx, kind: search, target: "Phoenix metro population growth, domestic migration estimates, Maricopa and Pinal county migration reports", cadence: weekly, tags: [housing_market, benchmark], reliability: 0.6, max_items: 4}
  # ================================================================= Jackson: local and state news ==
  jh-buckrail:         {region: jh, kind: feed, target: "https://buckrail.com/feed/", cadence: daily, tags: [housing_market, policy, tourism], reliability: 0.7, max_items: 15}
  jh-buckrail-housing: {region: jh, kind: feed, target: "https://buckrail.com/tag/housing/feed/", cadence: daily, tags: [housing_policy, housing_market], reliability: 0.7}
  jh-buckrail-afford:  {region: jh, kind: feed, target: "https://buckrail.com/tag/affordable-housing/feed/", cadence: daily, tags: [housing_policy], reliability: 0.7}
  jh-buckrail-business: {region: jh, kind: feed, target: "https://buckrail.com/category/business/feed/", cadence: daily, tags: [employers, tourism], reliability: 0.7}
  jh-buckrail-pass:    {region: jh, kind: feed, target: "https://buckrail.com/tag/teton-pass/feed/", cadence: daily, tags: [transport], reliability: 0.7}
  jh-buckrail-mktrpt:  {region: jh, kind: feed, target: "https://buckrail.com/tag/market-report/feed/", cadence: weekly, tags: [housing_market, brokerage_report], reliability: 0.6, notes: "Quarterly brokerage PDFs; cite only."}
  jh-wyofile:          {region: jh, kind: feed, target: "https://wyofile.com/feed/", cadence: daily, tags: [policy, legislature, taxes], reliability: 0.8, keywords: [Teton, Jackson, property tax, housing, short-term rental, lodging, legislature, tourism, Wilson, Alpine, Star Valley]}
  jh-wyofile-econ:     {region: jh, kind: feed, target: "https://wyofile.com/category/economy/feed/", cadence: weekly, tags: [employers, policy], reliability: 0.8}
  jh-wyofile-housing:  {region: jh, kind: feed, target: "https://wyofile.com/tag/housing/feed/", cadence: weekly, tags: [housing_policy], reliability: 0.8}
  jh-wpm-jackson:      {region: jh, kind: feed, target: "https://www.wyomingpublicmedia.org/tags/jackson.rss", cadence: daily, tags: [housing_market, policy], reliability: 0.75}
  jh-wpm-news:         {region: jh, kind: feed, target: "https://www.wyomingpublicmedia.org/news.rss", cadence: daily, tags: [policy], reliability: 0.75, keywords: [Teton, Jackson, property tax, housing, legislature, tourism, Grand Teton, Yellowstone]}
  jh-csd:              {region: jh, kind: feed, target: "https://cowboystatedaily.com/rss.xml", cadence: daily, tags: [policy, legislature], reliability: 0.6, keywords: [Teton, Jackson, property tax, housing, short-term rental, lodging tax, legislature, Grand Teton]}
  jh-khol:             {region: jh, kind: feed, target: "https://www.jhcr.org/feed/", cadence: daily, tags: [policy, tourism], reliability: 0.65, keywords: [housing, council, county, commission, tax, rent, Teton Pass, START, airport, visitation, lodging]}
  # ================================================================= Jackson: government, housing, agendas ==
  jh-tcwy-news:        {region: jh, kind: feed, target: "https://www.tetoncountywy.gov/RSSFeed.aspx?ModID=1&CID=All-newsflash.xml", cadence: daily, tags: [policy, housing_policy], reliability: 0.95, ai_bot_rule: true, max_items: 8}
  jh-tcwy-housing:     {region: jh, kind: feed, target: "https://www.tetoncountywy.gov/RSSFeed.aspx?ModID=1&CID=Housing-News-17", cadence: weekly, tags: [housing_policy], reliability: 0.95, ai_bot_rule: true, max_items: 5}
  jh-tcwy-agenda:      {region: jh, kind: feed, target: "https://www.tetoncountywy.gov/RSSFeed.aspx?ModID=65&CID=All-0", cadence: daily, tags: [agendas, policy], reliability: 0.95, ai_bot_rule: true, max_items: 8}
  jh-tcwy-housing-page: {region: jh, kind: url, target: "https://www.tetoncountywy.gov/3038/Affordable-Housing", cadence: weekly, tags: [housing_policy], reliability: 0.95, ai_bot_rule: true}
