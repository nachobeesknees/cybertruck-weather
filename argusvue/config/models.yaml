# Model per role (SPEC §2) and list prices used for the spend ledger. Verified against the Claude API
# reference on 2026-11-05: Claude 5.5 family ids are complete as-is (no date suffix).
roles:
  triage:      claude-haiku-5-5
  extraction:  claude-sonnet-5-5
  resolution:  claude-sonnet-5-5
  entailment:  claude-sonnet-5-5
  scout:       claude-sonnet-5-5
  analyst:     claude-opus-5-5
  critic:      claude-opus-5-5
  editor:      claude-opus-5-5
# USD per million tokens. cache_write assumed 1.25x input where not published; adjust if the invoice differs.
pricing:
  claude-haiku-5-5:  {input: 0.10, output: 0.50,  cache_read: 0.01, cache_write: 0.125}
  claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_read: 0.20, cache_write: 2.50}
  claude-opus-5-5:   {input: 4.00, output: 20.00, cache_read: 0.20, cache_write: 5.00}
  web_search_per_1k_usd: 10.00
# Default effort per role (output_config.effort). Haiku/Opus 5.5 default to medium if omitted.
effort:
  triage: low
  extraction: medium
  resolution: medium
  entailment: low
  scout: medium
  analyst: high
  critic: high
  editor: high
